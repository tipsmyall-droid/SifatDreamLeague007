name: Build Install Epic Final
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create Epic Game
        run: |
          cat > settings.gradle <<'ENDOFFILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          ENDOFFILE
          cat > build.gradle <<'ENDOFFILE'
          plugins { id 'com.android.application' version '8.2.0' apply false; id 'com.android.library' version '8.2.0' apply false }
          ENDOFFILE
          cat > gradle.properties <<'ENDOFFILE'
          android.useAndroidX=true
          ENDOFFILE
          mkdir -p app/src/main/java/com/sifat/dreamleague
          cat > app/build.gradle <<'ENDOFFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sifat.dreamleague'
              compileSdk 33
              defaultConfig { applicationId "com.sifat.dreamleague.epic"; minSdk 21; targetSdk 33; versionCode 16; versionName "16.0-EPIC" }
              buildTypes { debug { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          ENDOFFILE
          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Dream League Epic" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          ENDOFFILE
          cat > app/src/main/java/com/sifat/dreamleague/GameView.java <<'ENDOFFILE'
          package com.sifat.dreamleague;
          import android.content.Context; import android.graphics.*; import android.view.MotionEvent; import android.view.View;
          public class GameView extends View {
              Paint p=new Paint(); float bx=540, by=900, bvx=0, bvy=0, px=540, py=1300, gkX=540, gkVX=7; int score=0; long start=System.currentTimeMillis();
              public GameView(Context c){super(c);}
              protected void onDraw(Canvas canvas){
                  super.onDraw(canvas); canvas.drawColor(Color.parseColor("#2E7D32"));
                  int w=getWidth(), h=getHeight();
                  p.setColor(Color.WHITE); p.setStrokeWidth(12); p.setStyle(Paint.Style.STROKE);
                  canvas.drawRect(20,70,w-20,h-70,p); canvas.drawLine(w/2,70,w/2,h-70,p); canvas.drawCircle(w/2,h/2,160,p);
                  canvas.drawRect(w/2-200,70,w/2+200,250,p); canvas.drawRect(w/2-200,h-250,w/2+200,h-70,p);
                  gkX+=gkVX; if(gkX<w/2-160||gkX>w/2+160) gkVX*=-1;
                  p.setStyle(Paint.Style.FILL); p.setColor(Color.RED); canvas.drawCircle(gkX,180,48,p);
                  p.setColor(Color.BLUE); canvas.drawCircle(px,py,45,p); p.setColor(Color.WHITE); canvas.drawCircle(bx,by,32,p);
                  bx+=bvx; by+=bvy; bvx*=0.985f; bvy*=0.985f;
                  if(bx<35||bx>w-35) bvx*=-1; if(by<80||by>h-80) bvy*=-1;
                  if(Math.hypot(bx-gkX, by-180)<75){ bvy=12; bvx=(bx-gkX)/5; }
                  if(bx>w/2-200&&bx<w/2+200&&by<200){ if(Math.abs(bx-gkX)>65) score++; bx=540; by=900; bvx=0; bvy=0; }
                  p.setColor(Color.YELLOW); p.setTextSize(46); p.setFakeBoldText(true); canvas.drawText("GOAL: "+score, 30, 50, p);
                  long left=90-(System.currentTimeMillis()-start)/1000; if(left<0) left=0; canvas.drawText(left+"s", w-120, 50, p);
                  if(left==0){ p.setColor(Color.BLACK); p.setAlpha(210); canvas.drawRect(0,0,w,h,p); p.setAlpha(255); p.setColor(Color.WHITE); p.setTextSize(62); p.setTextAlign(Paint.Align.CENTER); canvas.drawText("FULL TIME", w/2, h/2-20, p); p.setTextSize(50); canvas.drawText("Score: "+score, w/2, h/2+50, p); return; }
                  invalidate();
              }
              public boolean onTouchEvent(MotionEvent e){ px=e.getX(); py=e.getY(); float dx=bx-px, dy=by-py; if(Math.hypot(dx,dy)<170){ bvx=dx/7; bvy=dy/7; } return true; }
          }
          ENDOFFILE
          cat > app/src/main/java/com/sifat/dreamleague/MainActivity.java <<'ENDOFFILE'
          package com.sifat.dreamleague;
          import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle s){super.onCreate(s); setContentView(new GameView(this));} }
          ENDOFFILE
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK-INSTALL-EPIC-FINAL
          path: app/build/outputs/apk/debug/*.apk
