name: BUILD 32MB 11VS11 V2
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Make 11vs11 32MB
        run: |
          pip install Pillow -q
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false; id 'com.android.library' version '8.2.0' apply false }
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          rm -rf app/build
          mkdir -p app/src/main/java/com/sifat/myfootball2026
          mkdir -p app/src/main/assets
          python3 << 'PY'
          from PIL import Image
          import os
          for i in range(1,7):
              img = Image.effect_noise((1500,1500), 120).convert("RGB")
              path = f"app/src/main/assets/stadium_{i}.png"
              img.save(path, "PNG", compress_level=1)
              print(f"{path} -> {os.path.getsize(path)/1024/1024:.2f} MB")
          PY
          ls -lh app/src/main/assets/
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sifat.myfootball2026'
              compileSdk 33
              defaultConfig { applicationId "com.sifat.myfootball2026"; minSdk 21; targetSdk 33; versionCode 1; versionName "1.0" }
              buildTypes { debug { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="11vs11 32MB V2"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/sifat/myfootball2026/GameView.java <<'EOF'
          package com.sifat.myfootball2026; import android.content.Context; import android.graphics.*; import android.view.MotionEvent; import android.view.View;
          public class GameView extends View { Paint p=new Paint(); float bx=540, by=700, bvx=0, bvy=0; float[] blueX=new float[11], blueY=new float[11], redX=new float[11], redY=new float[11]; int controlled=9, scoreBlue=0, scoreRed=0; long start=System.currentTimeMillis(); public GameView(Context c){ super(c); for(int i=0;i<11;i++){ blueX[i]=200+(i%4)*200; blueY[i]=600+(i/4)*200; redX[i]=200+(i%4)*200; redY[i]=200+(i/4)*150; } blueX[10]=540; blueY[10]=1500; redX[10]=540; redY[10]=120; bx=540; by=700; } protected void onDraw(Canvas c){ super.onDraw(c); int w=getWidth(), h=getHeight(); c.drawColor(Color.parseColor("#2E7D32")); p.setColor(Color.WHITE); p.setStrokeWidth(8); p.setStyle(Paint.Style.STROKE); c.drawRect(20,60,w-20,h-60,p); c.drawLine(w/2,60,w/2,h-60,p); c.drawCircle(w/2,h/2,130,p); c.drawRect(w/2-180,60,w/2+180,200,p); c.drawRect(w/2-180,h-200,w/2+180,h-60,p); bx+=bvx; by+=bvy; bvx*=0.98f; bvy*=0.98f; if(bx<20||bx>w-20) bvx*=-1; if(by<60||by>h-60) bvy*=-1; for(int i=0;i<11;i++){ if(i!=controlled){ float dx=bx-blueX[i], dy=by-blueY[i]; if(Math.hypot(dx,dy)<400){ blueX[i]+=dx*0.02f; blueY[i]+=dy*0.02f; } } float dx=bx-redX[i], dy=by-redY[i]; if(Math.hypot(dx,dy)<500){ redX[i]+=dx*0.03f; redY[i]+=dy*0.03f; } } if(Math.hypot(bx-redX[10], by-redY[10])<60){ bvy=10; bvx=(bx-redX[10])/4; } if(bx>w/2-180&&bx<w/2+180&&by<140){ if(Math.abs(bx-redX[10])>40) scoreBlue++; bx=540; by=700; bvx=0; bvy=0; } if(bx>w/2-180&&bx<w/2+180&&by>h-140){ scoreRed++; bx=540; by=700; bvx=0; bvy=0; } p.setStyle(Paint.Style.FILL); for(int i=0;i<11;i++){ p.setColor(Color.BLUE); if(i==controlled) p.setColor(Color.CYAN); c.drawCircle(blueX[i], blueY[i], 28, p); p.setColor(Color.RED); if(i==10) p.setColor(Color.parseColor("#FF9800")); c.drawCircle(redX[i], redY[i], 28, p); } p.setColor(Color.WHITE); c.drawCircle(bx,by,22,p); p.setColor(Color.YELLOW); p.setTextSize(36); p.setFakeBoldText(true); c.drawText("BLUE "+scoreBlue+" - "+scoreRed+" RED", w/2-150, 45, p); long left=90-(System.currentTimeMillis()-start)/1000; if(left<0) left=0; c.drawText(left+"s", 30, 45, p); if(left==0){ p.setColor(Color.BLACK); p.setAlpha(200); c.drawRect(0,0,w,h,p); p.setAlpha(255); p.setColor(Color.WHITE); p.setTextSize(58); p.setTextAlign(Paint.Align.CENTER); c.drawText("FULL TIME", w/2, h/2, p); p.setTextSize(40); c.drawText("BLUE "+scoreBlue+" - "+scoreRed+" RED", w/2, h/2+60, p); return; } invalidate(); } public boolean onTouchEvent(MotionEvent e){ float tx=e.getX(), ty=e.getY(); float best=9999; int idx=controlled; for(int i=0;i<11;i++){ float d=(float)Math.hypot(tx-blueX[i], ty-blueY[i]); if(d<best){ best=d; idx=i; } } controlled=idx; blueX[controlled]=tx; blueY[controlled]=ty; float dx=bx-blueX[controlled], dy=by-blueY[controlled]; if(Math.hypot(dx,dy)<80){ bvx=dx/5; bvy=dy/5; } return true; } }
          EOF
          cat > app/src/main/java/com/sifat/myfootball2026/MainActivity.java <<'EOF'
          package com.sifat.myfootball2026; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle s){super.onCreate(s); setContentView(new GameView(this));} }
          EOF
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Build
        run: gradle clean assembleDebug --no-build-cache --rerun-tasks
      - name: Check Size
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "APK MB: $((SIZE/1024/1024))"
      - uses: actions/upload-artifact@v4
        with:
          name: APK-32MB-REAL-11VS11-V2-NEW
          path: app/build/outputs/apk/debug/*.apk
