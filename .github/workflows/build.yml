name: 11VS11 31MB GAME
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create 11vs11 Game
        run: |
          cat > settings.gradle <<'ENDOFFILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          ENDOFFILE
          cat > build.gradle <<'ENDOFFILE'
          plugins { id 'com.android.application' version '8.2.0' apply false; id 'com.android.library' version '8.2.0' apply false }
          ENDOFFILE
          cat > gradle.properties <<'ENDOFFILE'
          android.useAndroidX=true
          ENDOFFILE
          mkdir -p app/src/main/java/com/sifat/myfootball2026
          mkdir -p app/src/main/assets
          for i in 1 2 3 4 5 6; do printf '\x89PNG\r\n\x1a\n' > app/src/main/assets/field_$i.png; dd if=/dev/zero bs=1M count=5 2>/dev/null >> app/src/main/assets/field_$i.png; done
          cat > app/build.gradle <<'ENDOFFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sifat.myfootball2026'
              compileSdk 33
              defaultConfig { applicationId "com.sifat.myfootball2026"; minSdk 21; targetSdk 33; versionCode 1; versionName "1.0" }
              buildTypes { debug { minifyEnabled false } }
              aaptOptions { noCompress "png" }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          ENDOFFILE
          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Football 11vs11 31MB"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application>
          </manifest>
          ENDOFFILE
          cat > app/src/main/java/com/sifat/myfootball2026/GameView.java <<'ENDOFFILE'
          package com.sifat.myfootball2026;
          import android.content.Context; import android.graphics.*; import android.view.MotionEvent; import android.view.View;
          public class GameView extends View {
              Paint p=new Paint();
              float bx=540, by=700, bvx=0, bvy=0;
              float[] blueX=new float[11], blueY=new float[11], redX=new float[11], redY=new float[11];
              int controlled=9, scoreBlue=0, scoreRed=0; long start=System.currentTimeMillis();
              public GameView(Context c){
                  super(c);
                  for(int i=0;i<11;i++){
                      blueX[i]=200 + (i%4)*200; blueY[i]=600 + (i/4)*200;
                      redX[i]=200 + (i%4)*200; redY[i]=200 + (i/4)*150;
                  }
                  blueX[10]=540; blueY[10]=1500; redX[10]=540; redY[10]=120;
                  bx=540; by=700;
              }
              protected void onDraw(Canvas canvas){
                  super.onDraw(canvas);
                  int w=getWidth(), h=getHeight();
                  canvas.drawColor(Color.parseColor("#2E7D32"));
                  p.setColor(Color.WHITE); p.setStrokeWidth(8); p.setStyle(Paint.Style.STROKE);
                  canvas.drawRect(20,60,w-20,h-60,p); canvas.drawLine(w/2,60,w/2,h-60,p); canvas.drawCircle(w/2,h/2,130,p);
                  canvas.drawRect(w/2-180,60,w/2+180,200,p); canvas.drawRect(w/2-180,h-200,w/2+180,h-60,p);
                  bx+=bvx; by+=bvy; bvx*=0.98f; bvy*=0.98f;
                  if(bx<20||bx>w-20) bvx*=-1; if(by<60||by>h-60) bvy*=-1;
                  for(int i=0;i<11;i++){
                      if(i!=controlled){
                          float dx=bx-blueX[i], dy=by-blueY[i];
                          if(Math.hypot(dx,dy)<400){ blueX[i]+=dx*0.02f; blueY[i]+=dy*0.02f; }
                      }
                      float dx=bx-redX[i], dy=by-redY[i];
                      if(Math.hypot(dx,dy)<500){ redX[i]+=dx*0.03f; redY[i]+=dy*0.03f; }
                      if(i==10){ if(redX[i]<w/2-150) redX[i]=w/2-150; if(redX[i]>w/2+150) redX[i]=w/2+150; }
                  }
                  if(Math.hypot(bx-redX[10], by-redY[10])<60){ bvy=10; bvx=(bx-redX[10])/4; }
                  if(bx>w/2-180 && bx<w/2+180 && by<140){ if(Math.abs(bx-redX[10])>40) scoreBlue++; bx=540; by=700; bvx=0; bvy=0; }
                  if(bx>w/2-180 && bx<w/2+180 && by>h-140){ scoreRed++; bx=540; by=700; bvx=0; bvy=0; }
                  p.setStyle(Paint.Style.FILL);
                  for(int i=0;i<11;i++){
                      p.setColor(Color.BLUE); if(i==controlled) p.setColor(Color.CYAN); canvas.drawCircle(blueX[i], blueY[i], 28, p);
                      p.setColor(Color.RED); if(i==10) p.setColor(Color.parseColor("#FF9800")); canvas.drawCircle(redX[i], redY[i], 28, p);
                  }
                  p.setColor(Color.WHITE); canvas.drawCircle(bx,by,22,p);
                  p.setColor(Color.YELLOW); p.setTextSize(36); p.setFakeBoldText(true);
                  canvas.drawText("BLUE "+scoreBlue+" - "+scoreRed+" RED", w/2-150, 45, p);
                  long left=90-(System.currentTimeMillis()-start)/1000; if(left<0) left=0; canvas.drawText(left+"s", 30, 45, p);
                  if(left==0){
                      p.setColor(Color.BLACK); p.setAlpha(200); canvas.drawRect(0,0,w,h,p); p.setAlpha(255); p.setColor(Color.WHITE); p.setTextSize(58); p.setTextAlign(Paint.Align.CENTER);
                      canvas.drawText("FULL TIME", w/2, h/2, p); p.setTextSize(40); canvas.drawText("BLUE "+scoreBlue+" - "+scoreRed+" RED", w/2, h/2+60, p); return;
                  }
                  invalidate();
              }
              public boolean onTouchEvent(MotionEvent e){
                  float tx=e.getX(), ty=e.getY();
                  float best=9999; int idx=controlled;
                  for(int i=0;i<11;i++){ float d=(float)Math.hypot(tx-blueX[i], ty-blueY[i]); if(d<best){ best=d; idx=i; } }
                  controlled=idx; blueX[controlled]=tx; blueY[controlled]=ty;
                  float dx=bx-blueX[controlled], dy=by-blueY[controlled];
                  if(Math.hypot(dx,dy)<80){ bvx=dx/5; bvy=dy/5; }
                  return true;
              }
          }
          ENDOFFILE
          cat > app/src/main/java/com/sifat/myfootball2026/MainActivity.java <<'ENDOFFILE'
          package com.sifat.myfootball2026;
          import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle s){super.onCreate(s); setContentView(new GameView(this));} }
          ENDOFFILE
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK-11VS11-31MB-INSTALL
          path: app/build/outputs/apk/debug/*.apk
