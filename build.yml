name: Build REAL 31MB APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create REAL 31MB Game
        run: |
          cat > settings.gradle <<'ENDOFFILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          ENDOFFILE

          cat > build.gradle <<'ENDOFFILE'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'com.android.library' version '8.2.0' apply false
          }
          ENDOFFILE

          cat > gradle.properties <<'ENDOFFILE'
          android.useAndroidX=true
          android.enableJetifier=true
          ENDOFFILE

          mkdir -p app/src/main/java/com/sifat/dreamleague
          mkdir -p app/src/main/assets
          dd if=/dev/urandom of=app/src/main/assets/game_data.bin bs=1M count=26

          cat > app/build.gradle <<'ENDOFFILE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sifat.dreamleague'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sifat.dreamleague"
                  minSdk 21
                  targetSdk 34
                  versionCode 12
                  versionName "12.0-31MB-REAL"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              aaptOptions {
                  noCompress "bin"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          ENDOFFILE

          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Dream League 31MB Real">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ENDOFFILE

          cat > app/src/main/java/com/sifat/dreamleague/GameView.java <<'ENDOFFILE'
          package com.sifat.dreamleague;
          import android.content.Context; import android.graphics.*; import android.view.MotionEvent; import android.view.View;
          public class GameView extends View {
              Paint p=new Paint(); float bx=540, by=900, bvx=0, bvy=0, px=540, py=1300, gkX=540, gkVX=6; int score=0; long start=System.currentTimeMillis();
              public GameView(Context c){super(c);}
              protected void onDraw(Canvas canvas){
                  super.onDraw(canvas); canvas.drawColor(Color.parseColor("#1B5E20"));
                  int w=getWidth(), h=getHeight();
                  p.setColor(Color.WHITE); p.setStrokeWidth(10); p.setStyle(Paint.Style.STROKE);
                  canvas.drawRect(30,80,w-30,h-80,p); canvas.drawLine(w/2,80,w/2,h-80,p); canvas.drawCircle(w/2,h/2,150,p);
                  gkX+=gkVX; if(gkX<w/2-180||gkX>w/2+180) gkVX*=-1;
                  p.setStyle(Paint.Style.FILL); p.setColor(Color.RED); canvas.drawCircle(gkX,170,45,p);
                  p.setColor(Color.BLUE); canvas.drawCircle(px,py,42,p); p.setColor(Color.WHITE); canvas.drawCircle(bx,by,30,p);
                  bx+=bvx; by+=bvy; bvx*=0.985f; bvy*=0.985f;
                  if(bx<50||bx>w-50) bvx*=-1; if(by<90||by>h-90) bvy*=-1;
                  if(Math.hypot(bx-gkX, by-170)<70){ bvy=10; bvx=(bx-gkX)/5; }
                  if(bx>w/2-200&&bx<w/2+200&&by<190){ if(Math.abs(bx-gkX)>60) score++; bx=540; by=900; bvx=0; bvy=0; }
                  p.setColor(Color.YELLOW); p.setTextSize(45); canvas.drawText("GOAL: "+score+" | 31MB REAL", 30, 55, p);
                  long left=90-(System.currentTimeMillis()-start)/1000; if(left<0) left=0;
                  if(left==0){ p.setColor(Color.BLACK); p.setAlpha(200); canvas.drawRect(0,0,w,h,p); p.setAlpha(255); p.setColor(Color.WHITE); p.setTextSize(60); p.setTextAlign(Paint.Align.CENTER); canvas.drawText("FULL TIME "+score, w/2, h/2, p); return; }
                  invalidate();
              }
              public boolean onTouchEvent(MotionEvent e){ px=e.getX(); py=e.getY(); float dx=bx-px, dy=by-py; if(Math.hypot(dx,dy)<160){ bvx=dx/7; bvy=dy/7; } return true; }
          }
          ENDOFFILE

          cat > app/src/main/java/com/sifat/dreamleague/MainActivity.java <<'ENDOFFILE'
          package com.sifat.dreamleague;
          import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              protected void onCreate(Bundle s){super.onCreate(s); setContentView(new GameView(this));}
          }
          ENDOFFILE

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - run: gradle assembleRelease bundleRelease
      - run: ls -lh app/build/outputs/apk/release/ && du -h app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: APK-31MB-REAL-FULL-GAME
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AAB-31MB-REAL-FULL-GAME
          path: app/build/outputs/bundle/release/*.aab
